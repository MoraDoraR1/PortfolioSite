name: Deploy portfolio to GitHub Pages

# 이 워크플로는 GitHub Pages의 Source를 "GitHub Actions"로 설정했을 때 동작합니다.
# (Settings → Pages → Build and deployment → Source: GitHub Actions)
# 단순 정적 사이트라면 "Deploy from a branch" 방식(README 참고)만으로도 배포됩니다.

on:
  push:
    branches:
      - claude/happy-heisenberg-udqblq
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 동시에 여러 배포가 겹치지 않도록 큐잉
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 저장소 루트를 그대로 배포 (index.html + assets)
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
